name: Build marketplace pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - site_upgrade.js
      - postprocess.js
      - fixups.js
      - creative_audit.js
      - late_overrides.js
      - session_overrides.js
      - background_overrides.js
      - valuation_overrides.js
      - crypto_valuation.js
      - x_valuation.js
      - presentation_polish.js
      - final_portfolio_overrides.js
      - premium_sync.js
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node site_upgrade.js
      - run: node postprocess.js
      - run: node fixups.js
      - run: node creative_audit.js
      - run: node session_overrides.js
      - run: node late_overrides.js
      - run: node background_overrides.js
      - run: node valuation_overrides.js
      - run: node crypto_valuation.js
      - run: node x_valuation.js
      - run: node presentation_polish.js
      - run: node final_portfolio_overrides.js
      - run: node premium_sync.js
      - name: Publish generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets domain use-cases sitemap.xml robots.txt crypto-valuation-report.json x-valuation-report.json
          git diff --cached --quiet || git commit -m "Generate individual domain pages"
          git push
